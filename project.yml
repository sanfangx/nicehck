name: nicehck
options:
  bundleIdPrefix: com.nicehck
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en
    - ja
    - ko

targets:
  nicehck:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: nicehck
        excludes:
          - "Info.plist"
    info:
      path: nicehck/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicehck.yuandao
        PRODUCT_NAME: nicehck
        MARKETING_VERSION: "2.2.7"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: nicehck/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
